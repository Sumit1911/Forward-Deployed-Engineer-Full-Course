<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomato Support Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-panel" aria-label="Tomato support chat">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Tomato</p>
            <h1>Support Chat</h1>
          </div>
          <span class="status">Online</span>
        </header>

        <div id="messages" class="messages" aria-live="polite">
          <article class="message assistant">
            <div class="bubble">
              Hi, I am Tomato support. How can I help with your food order today?
            </div>
          </article>
        </div>

        <form id="chatForm" class="composer">
          <label class="sr-only" for="messageInput">Message</label>
          <textarea
            id="messageInput"
            name="message"
            rows="1"
            placeholder="Type your order, refund, or tracking question..."
            required
          ></textarea>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
